<!-- Your machine list UI -->

<div class="container">
  <div>
    <h2>WashIt Machines</h2>
  </div>

  <div class="text-center" *ngIf="machines.length === 0">
    No machines found.
  </div>
  <table class="table table-striped" *ngIf="machines.length > 0">
    <thead>
      <tr>
        <th>Machine Name</th>
        <th>Wash Type</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of machines">
        <td>{{ m.MachineName }}</td>
        <td>{{ getWashTypeName(m.WashTypeId) }}</td>
        <td>{{ m.Status }}</td>
        <td>
          <button
            class="btn btn-success btn-sm"
            *ngIf="m.Status === 'Available'"
            (click)="reserve(m)"
          >
            Reserve
          </button>
          <button
            class="btn btn-danger btn-sm"
            *ngIf="m.Status === 'Reserved by you'"
            (click)="cancelReservation(m)"
          >
            Cancel
          </button>
          <button
            class="btn btn-secondary btn-sm"
            *ngIf="m.Status === 'Reserved by other'"
            (click)="joinWaitlist(m)"
          >
            Join Waitlist
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
