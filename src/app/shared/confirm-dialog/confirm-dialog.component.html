<div class="">

  <h3 mat-dialog-title class="ms-3">
    Confirmation
  </h3>

  <mat-dialog-content class="">
    {{ data.message }}
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="">
    <button class="btn btn-secondary me-2" mat-stroked-button color="warn" (click)="dialogRef.close(false)">
      No
    </button>

    <button class="btn btn-primary" mat-raised-button color="primary" (click)="dialogRef.close(true)">
      Yes
    </button>
  </mat-dialog-actions>

</div>
